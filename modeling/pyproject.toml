[project]
name = "for-nav-modeling"
version = "0.1.0"
description = "울산 외국인 의료 내비게이터 응급도·진료과 모델과 학습 데이터"
requires-python = ">=3.12"
dependencies = [
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 어휘·템플릿 문장은 프론트와 한 줄씩 대조하기 쉽게 줄을 나누지 않는다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
