name: Git flow
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  approval-gate:
    runs-on: ubuntu-latest
    steps:
      # Only trusted base code is executed; never checkout or execute the PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/git_flow.py check-pr
        env:
          GH_TOKEN: ${{ github.token }}
