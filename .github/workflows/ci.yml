name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # frontend 작업은 룰셋의 필수 검사가 보고되도록 이름만 남겨 두었다. 실제 검사 단계로 바꾸는 것은 별도 작업이다.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - run: echo "frontend 코드 없음 - 검사할 대상이 없다"
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
