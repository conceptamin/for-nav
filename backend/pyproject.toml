[project]
name = "for-nav-backend"
version = "0.1.0"
description = "울산 외국인 의료 내비게이터 목업 서버(FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.162.0",
    # 응급도·진료과 모델(MODEL_DIR이 있을 때만 import). lightgbm·numpy 버전은 modeling/pyproject.toml이 고정한다(backlog 12)
    "for-nav-modeling",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.uv.sources]
# predict가 modeling/models를 소스 위치에서 찾으므로 editable로만 설치한다
for-nav-modeling = { path = "../modeling", editable = true }

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 어휘·템플릿 문장은 프론트와 한 줄씩 대조하기 쉽게 줄을 나누지 않는다.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
